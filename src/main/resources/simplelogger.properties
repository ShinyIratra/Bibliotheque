# Configuration du logging SLF4J Simple
# Niveau de log par défaut
org.slf4j.simpleLogger.defaultLogLevel=info

# Afficher la date et l'heure
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss

# Afficher le nom du thread
org.slf4j.simpleLogger.showThreadName=true

# Afficher le nom du logger
org.slf4j.simpleLogger.showLogName=true

# Afficher le nom court du logger
org.slf4j.simpleLogger.showShortLogName=true

# Configuration spécifique par package
org.slf4j.simpleLogger.log.com.bibliotheque=debug
org.slf4j.simpleLogger.log.org.springframework=warn
org.slf4j.simpleLogger.log.org.hibernate=warn
org.slf4j.simpleLogger.log.org.hibernate.SQL=error

# Logging vers un fichier (si nécessaire)
# org.slf4j.simpleLogger.logFile=bibliotheque.log
